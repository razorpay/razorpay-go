name: CI
on:
  push:
    branches:
      - master
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Run tests and publish test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2

      # Start PMG in server mode to block malicious packages during installs
      - uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - uses: actions/setup-go@v2
        with:
          go-version: '1.26'

      - name: Run coverage
        run: |
         cd resources
         go test -race -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
           token: ${{ secrets.CODECOV_TOKEN }}

      # Enforce PMG policy and flush events to SafeDep Cloud
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
